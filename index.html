<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LSB Reading">
<title>LSB Reading</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#6e6e73;--line:#dedee3;--blue:#007aff;--green:#248a3d;--red:#d70015}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:radial-gradient(circle at 12% 0,rgba(0,122,255,.09),transparent 27%),var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:18px 16px 110px}.screen{display:none}.screen.active{display:block}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:10px 4px 8px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 7px 22px rgba(0,0,0,.045)}
.hero{padding:24px}.hero h1{font-size:36px;line-height:1.05;letter-spacing:-.035em;margin:7px 0 5px}.date{color:var(--muted);font-size:14px}.btn{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff;width:100%;font-size:17px;margin-top:18px}.secondary{background:#eef5ff;color:#0066d6;width:100%;margin-top:9px}.complete{background:#eaf7ee;color:#176c2f}.status{display:flex;align-items:center;justify-content:space-between;gap:12px}.status strong{font-size:16px}.good{color:var(--green)}.bad{color:#9a4b00}.smallBtn{border:0;background:#eef5ff;color:#0066d6;border-radius:11px;padding:9px 11px;font-weight:750}
.progressLine{height:7px;background:#e5e5ea;border-radius:99px;overflow:hidden;margin:11px 0 7px}.progressFill{height:100%;background:var(--blue);border-radius:99px}.muted{color:var(--muted);font-size:13px}
.search{width:100%;padding:12px 14px;border:1px solid #c7c7cc;border-radius:13px;background:#fff;color:#111;font:inherit;margin-bottom:10px}
.jump{width:100%;margin-bottom:14px;background:#007aff;color:#fff}
.month{margin-bottom:10px}.monthHead{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 15px;font:inherit;font-weight:760;color:var(--text)}.monthMeta{font-size:12px;color:var(--muted);font-weight:650}.monthRows{padding-top:6px}.monthRows[hidden]{display:none}
.reading{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:6px}.reading input{width:21px;height:21px;accent-color:var(--blue)}.readingText{flex:1;min-width:0}.readingTitle{font-weight:720}.readingDate{font-size:12px;color:var(--muted);margin-top:2px}.reading a{color:var(--blue);text-decoration:none;font-weight:720}.focus{outline:3px solid rgba(0,122,255,.28);outline-offset:2px}
.settingTitle{font-weight:780;font-size:17px;margin-bottom:5px}.dateInput{width:100%;padding:12px;border:1px solid #c7c7cc;border-radius:12px;background:#fff;color:#111;font:inherit}.danger{background:#fff0f1;color:var(--red);width:100%;margin-top:10px}
.tabbar{position:fixed;left:12px;right:12px;bottom:10px;max-width:696px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px;background:rgba(250,250,252,.95);border:1px solid var(--line);border-radius:22px;box-shadow:0 9px 30px rgba(0,0,0,.11);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:20}.tab{border:0;background:transparent;border-radius:15px;padding:9px 4px;color:var(--muted);font:inherit;font-size:12px;font-weight:700}.tab span{display:block;font-size:20px;line-height:19px;margin-bottom:3px}.tab.active{background:#fff;color:var(--blue)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#38383a}body{background:#000}.card,.monthHead,.reading{background:#1c1c1e}.search,.dateInput{background:#1c1c1e;color:#fff;border-color:#48484a}.tabbar{background:rgba(28,28,30,.95)}.tab.active{background:#2c2c2e;color:#0a84ff}.secondary,.smallBtn{background:#182b42;color:#64a8ff}.complete{background:#15351f;color:#63d17b}.danger{background:#3a1518;color:#ff453a}.progressLine{background:#333336}}
</style>
</head>
<body>
<div class="wrap">
<section id="todayScreen" class="screen active">
 <div class="eyebrow">Today</div>
 <div class="card hero">
  <div id="todayDate" class="date"></div>
  <h1 id="todayPassage">Loading…</h1>
  <button id="openToday" class="btn primary">Open in LSB ↗</button>
  <button id="completeToday" class="btn secondary">Mark Complete</button>
 </div>
 <div id="catchCard" class="card status"></div>
 <div class="card">
  <div class="status"><strong>3-Year Progress</strong><span id="progressPct" class="muted"></span></div>
  <div class="progressLine"><div id="progressFill" class="progressFill"></div></div>
  <div id="progressText" class="muted"></div>
 </div>
</section>

<section id="planScreen" class="screen">
 <div class="eyebrow">Plan</div>
 <input id="search" class="search" placeholder="Search passage or date">
 <button id="jumpUnread" class="btn jump">Jump to First Incomplete</button>
 <div id="planRows"></div>
</section>

<section id="settingsScreen" class="screen">
 <div class="eyebrow">Settings</div>
 <div class="card">
  <div class="settingTitle">Plan Start Date</div>
  <p class="muted">Sets the first incomplete reading to this date. All later incomplete readings continue on weekdays only.</p>
  <input id="startDate" class="dateInput" type="date">
  <button id="applyDate" class="btn primary">Apply Start Date</button>
  <div id="dateNote" class="muted" style="margin-top:10px"></div>
 </div>
 <div class="card">
  <div class="settingTitle">Progress</div>
  <p class="muted">Reset returns the plan to its original starting point: Genesis 1–16 completed, with the custom start date cleared.</p>
  <button id="reset" class="btn danger">Reset to Genesis 16</button>
 </div>
</section>
</div>
<nav class="tabbar">
 <button class="tab active" data-screen="todayScreen"><span>◉</span>Today</button>
 <button class="tab" data-screen="planScreen"><span>☷</span>Plan</button>
 <button class="tab" data-screen="settingsScreen"><span>⚙︎</span>Settings</button>
</nav>

function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fd(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
function sd(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function toggle(n){C[n]=!C[n];
const PROGRESS_KEY="lsbProgressCleanV1";

function save(){localStorage.setItem(PROGRESS_KEY,JSON.stringify(C))}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayISO(){return iso(new Date())}
function prettyDate(v){let [y,m,d]=v.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})}
function monthKey(v){return v.slice(0,7)}
function monthLabel(v){let [y,m]=v.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}
function weekdaysFrom(start,n){let [y,m,d]=start.split("-").map(Number),cur=new Date(y,m-1,d),out=[];while(out.length<n){if(cur.getDay()!=0&&cur.getDay()!=6)out.push(iso(cur));cur.setDate(cur.getDate()+1)}return out}
function seedGenesis16(){if(Object.keys(C).length)return;PLAN.forEach(x=>{if(x.passage.startsWith("Genesis ")){let r=x.passage.slice(8),end=parseInt(r.includes("-")?r.split("-")[1]:r,10);if(end<=16)C[x.day]=true}});save()}
function applyStart(start){let first=PLAN.findIndex(x=>!C[x.day]);if(first<0)return;let ds=weekdaysFrom(start,PLAN.length-first);for(let i=first;i<PLAN.length;i++)PLAN[i].date=ds[i-first];localStorage.setItem(START_KEY,start)}

function firstUnread(){return PLAN.find(x=>!C[x.day])}
function missed(){let t=todayISO();return PLAN.filter(x=>x.date<t&&!C[x.day])}
function dueToday(){let t=todayISO();return PLAN.find(x=>x.date===t&&!C[x.day])||PLAN.find(x=>x.date===t)||firstUnread()}
function openReading(x){if(x)location.href=x.url}

function renderToday(){
 let x=dueToday(),t=todayISO(),ms=missed();
 document.getElementById("todayDate").textContent=prettyDate(t);

 let open=document.getElementById("openToday"),done=document.getElementById("completeToday");

 let catchCard=document.getElementById("catchCard");
 if(ms.length){let oldest=ms[0];catchCard.innerHTML=`<div><strong class="bad">${ms.length} missed reading${ms.length===1?"":"s"}</strong><div class="muted">Oldest: ${oldest.passage}</div></div><button class="smallBtn" id="catchBtn">Read</button>`;document.getElementById("catchBtn").onclick=()=>openReading(oldest)}
 else catchCard.innerHTML=`<div><strong class="good">✓ Caught up</strong><div class="muted">No missed readings through today.</div></div>`;
 let doneCount=PLAN.filter(x=>C[x.day]).length,pct=Math.round(doneCount/PLAN.length*100);
 document.getElementById("progressPct").textContent=pct+"%";
 document.getElementById("progressFill").style.width=pct+"%";
 document.getElementById("progressText").textContent=`${doneCount} of ${PLAN.length} readings complete`;
}
function readingHTML(x){return `<div class="reading" data-day="${x.day}"><input type="checkbox" ${C[x.day]?"checked":""}><div class="readingText"><div class="readingTitle">${x.passage}</div><div class="readingDate">${prettyDate(x.date)}</div></div><a href="${x.url}">Read ↗</a></div>`}
function renderPlan(){
 let q=document.getElementById("search").value.trim().toLowerCase(),items=PLAN.filter(x=>!q||x.passage.toLowerCase().includes(q)||x.date.includes(q));
 let fu=firstUnread(),groups=[];
 items.forEach(x=>{let k=monthKey(x.date),g=groups.find(z=>z.key===k);if(!g){g={key:k,label:monthLabel(x.date),items:[]};groups.push(g)}g.items.push(x)});
 document.getElementById("planRows").innerHTML=groups.map(g=>{let done=g.items.filter(x=>C[x.day]).length,current=fu&&g.items.some(x=>x.day===fu.day);return `<div class="month" data-month="${g.key}"><button class="monthHead"><span>${g.label}</span><span class="monthMeta">${done}/${g.items.length}${current?" · Current":""}</span></button><div class="monthRows" ${current||q?"":"hidden"}>${g.items.map(readingHTML).join("")}</div></div>`}).join("");
 document.querySelectorAll(".monthHead").forEach(b=>b.onclick=()=>{let r=b.nextElementSibling;r.hidden=!r.hidden});
 document.querySelectorAll(".reading").forEach(el=>{let day=+el.dataset.day,cb=el.querySelector("input");cb.onchange=()=>{C[day]=cb.checked;save();renderAll()}});
}
function jumpUnread(){

}
function renderSettings(){
