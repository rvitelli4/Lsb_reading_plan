<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#315c47">
<title>LSB 3-Year Bible Reading Tracker</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#202520;--muted:#687069;--line:#dddeda;--green:#315c47;--green2:#e8f0eb;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 50px}
header,.today,.stats,.tools{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
h1{font-size:25px;margin:0 0 5px} h2{font-size:19px;margin:0 0 8px} p{margin:5px 0} .muted{color:var(--muted);font-size:14px}
.today{background:var(--green);color:#fff;border:0} .today .muted{color:#dce7e0}
button,.button{font:inherit;border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:#fff;color:var(--green)} .secondary{background:var(--green2);color:var(--green)} .danger{background:#f3e8e8;color:#8a3030}
.statsline{display:flex;justify-content:space-between;margin:7px 0;font-weight:650}
.progress{height:10px;background:#e4e6e2;border-radius:99px;overflow:hidden;margin:12px 0 4px}
.progress>div{height:100%;background:var(--green);width:0}
.tools{position:sticky;top:0;z-index:5;background:rgba(245,244,239,.94);backdrop-filter:blur(10px)}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:9px}
.row{display:grid;grid-template-columns:48px 95px 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin:6px 0}
.row.done{background:#eef3ef;opacity:.72} .num,.date{font-size:12px;color:var(--muted)} .passage{font-weight:650}
.open{color:var(--green);text-decoration:none;font-weight:700;font-size:14px}
.check{width:22px;height:22px;accent-color:var(--green)}
.actions{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:520px){.row{grid-template-columns:30px 74px 1fr auto;gap:5px} .open{font-size:0} .open::after{content:"LSB";font-size:14px}}
</style>
</head>
<body>
<main>
<header>
<h1>3-Year Weekday LSB Reading Plan</h1>
<p class="muted">Sep 16, 2026 – Sep 14, 2029 · weekdays only · 783 readings</p>
<p>Tap the checkbox when you finish. Your progress is saved on this device, including after you close Safari.</p>
</header>

<section class="today">
<h2 id="todayTitle">Today's Reading</h2>
<p id="todayPassage">Loading…</p>
<p id="todayStatus" class="muted"></p>
<div class="actions">
<a id="todayOpen" class="button primary" target="_blank" rel="noopener">Open in LSB</a>
<button id="todayCheck" class="button primary">Mark Complete</button>
</div>
</section>

<section class="stats">
<div class="statsline"><span>Progress</span><span id="stats">0 / 783 completed</span></div>
<div class="progress"><div id="bar"></div></div>
<p id="catchup" class="muted"></p>
</section>

<section class="tools">
<input id="search" type="search" placeholder="Search passage or date…">
<div class="actions">
<button class="secondary" id="showRemaining">Show Remaining</button>
<button class="secondary" id="showAll">Show All</button>
<button class="danger" id="reset">Reset All Checkmarks</button>
</div>
</section>

<section id="list"></section>
</main>

const KEY="lsb-3-year-weekday-plan-v2";
let completed=JSON.parse(localStorage.getItem(KEY)||"{}");
let mode="remaining";

function save(){localStorage.setItem(KEY,JSON.stringify(completed));}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmt(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}
function updateStats(){
 const done=Object.values(completed).filter(Boolean).length;
 document.getElementById("stats").textContent=`${done} / ${plan.length} completed`;
 document.getElementById("bar").style.width=(done/plan.length*100)+"%";
 const next=plan.find(x=>!completed[x.day]);
 document.getElementById("catchup").textContent=next ? `Next unchecked reading: Day ${next.day} — ${next.passage} (${fmt(next.date)})` : "All readings completed!";
}
function toggle(day){
 completed[day]=!completed[day];
 save(); updateStats(); render();
}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const el=document.getElementById("list"); el.innerHTML="";
 plan.forEach(x=>{
   const match=(!q || `${x.day} ${x.date} ${x.passage}`.toLowerCase().includes(q));
   if(!match || (mode==="remaining" && completed[x.day])) return;
   const row=document.createElement("div");
   row.className="row"+(completed[x.day]?" done":"");
   row.innerHTML=`<input class="check" type="checkbox" ${completed[x.day]?"checked":""} aria-label="Completed ${x.passage}">
     <div class="num">Day ${x.day}</div><div class="date">${fmt(x.date)}</div>
     <div class="passage">${x.passage}</div><a class="open" href="${x.url}" target="_blank" rel="noopener">Open</a>`;
   row.querySelector(".check").addEventListener("change",()=>toggle(x.day));
   el.appendChild(row);
 });
}
function setupToday(){
 const t=todayISO(); let x=plan.find(y=>y.date===t);
 if(!x) x=plan.find(y=>y.date>t) || plan[plan.length-1];
 const weekend=t!==x.date;
 document.getElementById("todayPassage").textContent=`Day ${x.day} — ${x.passage}`;
 document.getElementById("todayStatus").textContent=weekend ? `Next scheduled reading: ${fmt(x.date)}` : `${fmt(x.date)}`;
 const a=document.getElementById("todayOpen"); a.href=x.url;
 const b=document.getElementById("todayCheck"); b.textContent=completed[x.day]?"Mark Uncomplete":"Mark Complete";
 b.onclick=()=>{toggle(x.day); setupToday();};
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("showRemaining").onclick=()=>{mode="remaining";render();};
document.getElementById("showAll").onclick=()=>{mode="all";render();};
document.getElementById("reset").onclick=()=>{if(confirm("Clear all completed readings?")){completed={};save();updateStats();setupToday();render();}};
setupToday();updateStats();render();
</script>
